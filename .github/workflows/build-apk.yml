name: Build and verify WFS StoryBoost APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'qa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and inspect APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Geometry regression suite
        run: bash scripts/test-ratio-geometry.sh
      - name: Fetch verified Qualcomm DnCNN model
        run: bash scripts/fetch-dncnn-model.sh
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK signature, manifest, launcher and ZIP
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          for ABI in arm64-v8a universal; do
            APK="app/build/outputs/apk/debug/app-${ABI}-debug.apk"
            test -s "$APK"
            unzip -t "$APK" | tail -1
            "$TOOLS/zipalign" -c -p 4 "$APK"
            "$TOOLS/apksigner" verify --min-sdk-version 29 --verbose --print-certs "$APK"
            "$TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging-$ABI.txt"
            grep -q "package: name='com.wfs.storyboost.studio'" "$RUNNER_TEMP/apk-badging-$ABI.txt"
            grep -q "application-label:'WFS StoryBoost'" "$RUNNER_TEMP/apk-badging-$ABI.txt"
            grep -q "com.wfs.storyboost.StudioHomeActivity" "$RUNNER_TEMP/apk-badging-$ABI.txt"
            unzip -Z1 "$APK" | grep -q '^res/mipmap-anydpi-v26/ic_launcher'
            unzip -Z1 "$APK" | grep -q '^assets/models/dncnn_25[.]tflite$'
            echo "- $ABI APK validated: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "### Debug APKs validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Install package: com.wfs.storyboost.studio (Android 10+)." >> "$GITHUB_STEP_SUMMARY"
          echo "Debug certificates may change between runs; use stable release signing for upgrades." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish optimized ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: WFS-StoryBoost-v3.0.0-beta2-ARM64-APK
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - name: Publish Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: WFS-StoryBoost-v3.0.0-beta2-Universal-APK
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
      - name: Configure stable release signing if secrets exist
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STORYBOOST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORYBOOST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STORYBOOST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STORYBOOST_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not set; only debug APK will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/storyboost-release.jks"
          echo "ORG_GRADLE_PROJECT_storyboostKeystoreFile=$RUNNER_TEMP/storyboost-release.jks" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_storyboostKeystorePassword=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_storyboostKeyAlias=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_storyboostKeyPassword=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          gradle --no-daemon :app:assembleRelease
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          for ABI in arm64-v8a universal; do
            APK="app/build/outputs/apk/release/app-${ABI}-release.apk"
            "$TOOLS/zipalign" -c -p 4 "$APK"
            "$TOOLS/apksigner" verify --min-sdk-version 29 --verbose --print-certs "$APK"
            "$TOOLS/aapt" dump badging "$APK" | grep "package: name='com.wfs.storyboost.studio'"
          done
      - name: Publish stable signed release APKs
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WFS-StoryBoost-v3.0.0-beta2-Release-Signed
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

  install-smoke:
    name: Android 35 emulator install and launch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WFS-StoryBoost-v3.0.0-beta2-Universal-APK
          path: smoke-apk
      - name: Allow Android emulator KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install smoke-apk/app-universal-debug.apk
            adb shell am start -W -n com.wfs.storyboost.studio/com.wfs.storyboost.StudioHomeActivity
            sleep 4
            adb shell pidof com.wfs.storyboost.studio
            adb shell screencap -p /sdcard/storyboost-home.png
            adb pull /sdcard/storyboost-home.png storyboost-home.png
            # Bottom tabs at x=160 (Editor), x=267 (Hasil) on the 320x640 emulator.
            adb shell am force-stop com.wfs.storyboost.studio
            adb shell am start -W -n com.wfs.storyboost.studio/com.wfs.storyboost.StudioHomeActivity --ez qa_demo true
            sleep 6
            adb shell pidof com.wfs.storyboost.studio
            adb shell dumpsys activity activities | grep -q 'StudioEditorActivity'
            adb shell screencap -p /sdcard/storyboost-editor.png
            adb pull /sdcard/storyboost-editor.png storyboost-editor.png
            adb shell am force-stop com.wfs.storyboost.studio
            adb shell am start -W -n com.wfs.storyboost.studio/com.wfs.storyboost.StudioHomeActivity --ez qa_merge true
            sleep 3
            adb shell pidof com.wfs.storyboost.studio
            adb shell dumpsys activity activities | grep -q 'StudioMergeActivity'
            adb shell screencap -p /sdcard/storyboost-merge.png
            adb pull /sdcard/storyboost-merge.png storyboost-merge.png
            # Exercise bundled ML models on offline-generated demo and verify UI stays alive.
            adb shell am force-stop com.wfs.storyboost.studio
            adb shell am start -W -n com.wfs.storyboost.studio/com.wfs.storyboost.StudioHomeActivity --ez qa_ai_demo true
            sleep 12
            adb shell pidof com.wfs.storyboost.studio
            adb shell dumpsys activity activities | grep -q 'StudioEditorActivity'
            adb shell screencap -p /sdcard/storyboost-ai-photo.png
            adb pull /sdcard/storyboost-ai-photo.png storyboost-ai-photo.png
            # Script is one command: emulator runner executes script lines separately.
            bash scripts/qa-emulator-photo.sh
            bash scripts/qa-emulator-screen-sizes.sh

      - name: Upload real app screenshot for UI inspection
        uses: actions/upload-artifact@v4
        with:
          name: WFS-StoryBoost-v3.0.0-beta2-Emulator-Screenshot
          path: |
            storyboost-*.png
            qa-photo-export.txt
            qa-photo-memory.txt
          if-no-files-found: error
  
  persisted-editor-qa:
    name: Android ${{ matrix.api }} instrumented draft/SAF response
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install test platform and media fixture dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Allow Android emulator KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Execute Activity integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash scripts/qa-video-fixtures.sh
            bash scripts/fetch-dncnn-model.sh
            gradle --no-daemon :app:connectedDebugAndroidTest
            bash scripts/qa-process-death-local.sh
      - name: Publish Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WFS-StoryBoost-beta2-Android-${{ matrix.api }}-Test-Reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
